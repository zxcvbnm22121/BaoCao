plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sevenam.pancakedashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sevenam.pancakedashboard'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
