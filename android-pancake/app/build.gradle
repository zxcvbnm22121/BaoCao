plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sevenam.pancakedashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sevenam.pancakedashboard'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '2.4.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
