name: Build SevenAM Pancake APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-pancake/**'
      - '.github/workflows/android-pancake-apk.yml'

permissions:
  contents: read

concurrency:
  group: sevenam-pancake-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android-pancake
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android-pancake/app/build/outputs/apk/debug/app-debug.apk SevenAM-Pancake-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SevenAM-Pancake-Dashboard-APK
          path: SevenAM-Pancake-Dashboard.apk
          if-no-files-found: error
          retention-days: 30
