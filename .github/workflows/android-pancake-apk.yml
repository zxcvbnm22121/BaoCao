name: Build SevenAM Pancake APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-pancake/**'
      - '.github/workflows/android-pancake-apk.yml'

permissions:
  contents: write

concurrency:
  group: sevenam-pancake-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android-pancake
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android-pancake/app/build/outputs/apk/debug/app-debug.apk SevenAM-Pancake-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SevenAM-Pancake-Dashboard-APK
          path: SevenAM-Pancake-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest SevenAM-Pancake-Dashboard.apk --clobber
          else
            gh release create android-latest SevenAM-Pancake-Dashboard.apk \
              --title "SevenAM Pancake Dashboard Android" \
              --notes "Bản Android mới nhất. File APK được cập nhật tự động từ nhánh main." \
              --target "${GITHUB_SHA}"
          fi
