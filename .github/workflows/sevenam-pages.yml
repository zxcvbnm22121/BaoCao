name: SevenAM Live Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/sync-pancake-pages.mjs'
      - 'scripts/sync-nhanh-pages.mjs'
      - '.github/workflows/sevenam-pages.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sevenam-pages-v6
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync Pancake and encrypt dashboard data
        env:
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          PANCAKE_SHOP_ID: ${{ secrets.PANCAKE_SHOP_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          MONTHLY_TARGET: ${{ vars.MONTHLY_TARGET }}
        run: node scripts/sync-pancake-pages.mjs

      - name: Verify fresh Pancake snapshot
        run: |
          node -e "const fs=require('fs');const p='site/data/status.json';if(!fs.existsSync(p))throw new Error('Missing Pancake status');const s=JSON.parse(fs.readFileSync(p,'utf8'));const age=Date.now()-Date.parse(s.updatedAt||'');if(s.mode!=='LIVE'||!Number.isFinite(age)||age>15*60*1000)throw new Error('Pancake snapshot is not fresh LIVE data');if(!fs.existsSync('site/data/live.enc')||!fs.existsSync('site/data/pancake-key.enc'))throw new Error('Missing encrypted Pancake artifacts');console.log('Fresh Pancake snapshot verified:',s.updatedAt,s.count);"

      - name: Sync Nhanh.vn showroom dashboard
        continue-on-error: true
        timeout-minutes: 4
        env:
          NHANH_APP_ID: ${{ secrets.NHANH_APP_ID }}
          NHANH_BUSINESS_ID: ${{ secrets.NHANH_BUSINESS_ID }}
          NHANH_ACCESS_TOKEN: ${{ secrets.NHANH_ACCESS_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/sync-nhanh-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
